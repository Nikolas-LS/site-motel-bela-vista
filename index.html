<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="canonical" href="https://www.motelbelavista.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#d9d9d9" />
    <script>
      // Define o tema antes da página aparecer: escolha salva ou tema do aparelho.
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'dark' || stored === 'light') theme = stored
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0f0d10'
      })()
    </script>
    <title>Motel Bela Vista</title>
    <meta name="description" content="Motel Bela Vista em São Leopoldo - RS: suítes com privacidade, conforto e discrição. Atendimento 24 horas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
